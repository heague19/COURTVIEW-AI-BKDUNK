<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>COURTVIEW — 전광판</title>
    <link rel="stylesheet" href="/static/css/theme.css">
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
    <script src="/static/js/auth-guard.js?v=20260421"></script>
    <style>
        body {
            margin: 0;
            overflow: hidden;
            background: #000;
            color: #fff;
            font-family: 'Noto Sans KR', 'Pretendard', sans-serif;
        }
        .sb-root {
            width: 100vw;
            height: 100vh;
            display: flex;
            flex-direction: column;
            position: relative;
            overflow: hidden;
        }

        /* 배경 radial rings (bkdunk 스타일) */
        .bg-rings {
            position: absolute; inset: 0; pointer-events: none;
            display: flex; align-items: center; justify-content: center;
            opacity: 0.4;
        }
        .bg-rings > div {
            position: absolute;
            border-radius: 50%;
            border: 1px solid rgba(255, 107, 53, 0.25);
        }
        .bg-rings .r1 { width: 700px; height: 700px; }
        .bg-rings .r2 { width: 1100px; height: 1100px; border-color: rgba(255, 107, 53, 0.15); }
        .bg-rings .r3 { width: 1500px; height: 1500px; border-color: rgba(255, 107, 53, 0.08); }

        /* 헤더 */
        .sb-header {
            height: 8vh;
            min-height: 60px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 40px;
            background: linear-gradient(180deg, rgba(255,107,53,0.08), transparent);
            border-bottom: 1px solid rgba(255,107,53,0.15);
        }
        .sb-logo {
            font-size: 22px;
            font-weight: 900;
            letter-spacing: 2px;
            font-style: italic;
        }
        .sb-logo .accent { color: var(--accent-orange); }
        .sb-venue {
            font-size: 14px;
            color: var(--text-gray);
        }

        /* 메인 스코어 영역 */
        .sb-main {
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
            z-index: 2;
        }

        .sb-score-grid {
            display: grid;
            grid-template-columns: 1fr auto 1fr;
            gap: 60px;
            align-items: center;
            padding: 0 60px;
            max-width: 1800px;
            width: 100%;
        }

        /* 팀 박스 */
        .sb-team {
            text-align: center;
            padding: 30px;
        }
        .sb-team-name {
            font-size: 56px;
            font-weight: 900;
            letter-spacing: -1px;
            margin-bottom: 20px;
        }
        .sb-team.home .sb-team-name { color: var(--accent-orange); }
        .sb-team.away .sb-team-name { color: var(--accent-blue); }

        .sb-team-score {
            font-size: 280px;
            font-weight: 900;
            line-height: 1;
            font-variant-numeric: tabular-nums;
            letter-spacing: -8px;
        }
        .sb-team.home .sb-team-score { color: var(--accent-orange); text-shadow: 0 0 60px rgba(255,107,53,0.4); }
        .sb-team.away .sb-team-score { color: var(--accent-blue); text-shadow: 0 0 60px rgba(68,136,255,0.4); }

        .sb-team-meta {
            display: flex;
            justify-content: center;
            gap: 30px;
            margin-top: 16px;
            font-size: 18px;
            color: var(--text-gray);
        }
        .sb-team-meta .val {
            color: #fff;
            font-weight: 700;
            font-size: 22px;
            margin-left: 6px;
        }

        /* 중앙 (쿼터 + 게임클락) */
        .sb-center {
            text-align: center;
            padding: 20px 30px;
        }
        .sb-quarter {
            font-size: 48px;
            font-weight: 900;
            color: var(--accent-yellow);
            letter-spacing: 2px;
            margin-bottom: 10px;
        }
        .sb-clock {
            font-size: 108px;
            font-weight: 900;
            color: #fff;
            font-variant-numeric: tabular-nums;
            letter-spacing: -2px;
            line-height: 1;
        }
        .sb-clock.warn { color: var(--accent-red); animation: pulse-red 0.8s ease-in-out infinite; }
        @keyframes pulse-red {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.5; }
        }
        .sb-shot-clock {
            display: inline-block;
            margin-top: 24px;
            padding: 14px 36px;
            background: rgba(255,221,68,0.15);
            border: 2px solid var(--accent-yellow);
            border-radius: var(--radius-md);
            font-size: 72px;
            font-weight: 900;
            color: var(--accent-yellow);
            font-variant-numeric: tabular-nums;
            min-width: 140px;
        }
        .sb-shot-clock.critical {
            background: rgba(255, 68, 68, 0.2);
            border-color: var(--accent-red);
            color: var(--accent-red);
            animation: pulse-red 0.5s ease-in-out infinite;
        }
        .sb-shot-label {
            font-size: 13px;
            color: var(--text-gray);
            letter-spacing: 2px;
            margin-top: 6px;
        }

        /* 하단 스코어 바 (팀 파울 + 타임아웃) */
        .sb-footer {
            height: 14vh;
            min-height: 100px;
            display: flex;
            justify-content: space-around;
            align-items: center;
            padding: 0 60px;
            border-top: 1px solid rgba(255,107,53,0.15);
            background: linear-gradient(0deg, rgba(0,0,0,0.5), transparent);
        }
        .sb-foot-team {
            display: flex;
            gap: 40px;
            align-items: center;
        }
        .sb-foot-block {
            text-align: center;
        }
        .sb-foot-block .label {
            font-size: 12px;
            color: var(--text-gray);
            letter-spacing: 2px;
            margin-bottom: 6px;
        }
        .sb-foot-block .value {
            font-size: 36px;
            font-weight: 900;
            color: #fff;
            font-variant-numeric: tabular-nums;
        }
        .sb-foot-block.home .value { color: var(--accent-orange); }
        .sb-foot-block.away .value { color: var(--accent-blue); }

        /* 모드 전환 (추후 확장) */
        .sb-mode {
            display: none;
        }
        .sb-mode.active {
            display: flex;
        }
        .sb-mode.mode-score {
            flex: 1;
            flex-direction: column;
        }

        /* 오프라인 알림 */
        .sb-offline {
            position: absolute;
            top: 12px;
            right: 12px;
            padding: 6px 12px;
            border-radius: var(--radius-pill);
            background: rgba(255, 68, 68, 0.15);
            border: 1px solid var(--accent-red);
            color: var(--accent-red);
            font-size: 11px;
            font-weight: 700;
            display: none;
        }
        .sb-offline.show { display: block; }
    </style>
</head>

<script>
// =============================================================================
// 전광판 상태 — operator에서 WebSocket broker + localStorage 폴백
// =============================================================================
const SAVE_KEY = 'cv_live_state';

// Ops broker 에서 받은 state 메모리 캐시 (operator authoritative)
let _remoteState = null;

function loadState() {
    if (_remoteState) return _remoteState;
    try {
        return JSON.parse(localStorage.getItem(SAVE_KEY) || '{}');
    } catch { return {}; }
}

function render() {
    const s = loadState();
    document.getElementById('sb-home-name').textContent = s.homeName || 'HOME';
    document.getElementById('sb-away-name').textContent = s.awayName || 'AWAY';
    document.getElementById('sb-home-score').textContent = s.homeScore ?? 0;
    document.getElementById('sb-away-score').textContent = s.awayScore ?? 0;

    const q = s.quarter || 1;
    const qLabel = q >= 5 ? `OT${q - 4}` : `${q}Q`;
    document.getElementById('sb-quarter').textContent = qLabel;

    // 게임 클락 + 작전타임/휴식 오버레이
    const gc = s.gameClock ?? 600;
    const clockEl = document.getElementById('sb-clock');

    if (s.timeoutRemaining > 0) {
        // 작전타임 카운트다운
        clockEl.textContent = `T/O ${s.timeoutRemaining}s`;
        clockEl.style.color = 'var(--accent-yellow)';
        clockEl.classList.remove('warn');
    } else if (s.breakRemaining > 0) {
        // 쿼터 간 휴식 카운트다운
        const label = s.breakKind === 'halftime' ? 'HALFTIME' : 'BREAK';
        const bm = Math.floor(s.breakRemaining / 60);
        const bs = s.breakRemaining % 60;
        clockEl.textContent = `${label} ${String(bm).padStart(2,'0')}:${String(bs).padStart(2,'0')}`;
        clockEl.style.color = 'var(--accent-blue)';
        clockEl.classList.remove('warn');
    } else {
        // 정상 게임 클락
        const m = Math.floor(gc / 60);
        const sec = gc % 60;
        if (gc <= 60) {
            clockEl.textContent = `${String(m).padStart(2,'0')}:${String(sec).padStart(2,'0')}.0`;
        } else {
            clockEl.textContent = `${String(m).padStart(2,'0')}:${String(sec).padStart(2,'0')}`;
        }
        clockEl.style.color = '';
        clockEl.classList.toggle('warn', gc <= 10);
    }

    // 샷 클락 — on=false 이거나 0이면 "—"
    const sc = s.shotClock ?? 24;
    const scEl = document.getElementById('sb-shot-clock');
    if (s.shotClockOn === false || sc === 0) {
        scEl.textContent = '—';
        scEl.style.opacity = '0.4';
        scEl.classList.remove('critical');
    } else {
        scEl.textContent = sc;
        scEl.style.opacity = '1';
        scEl.classList.toggle('critical', sc <= 5);
    }

    // 팀 파울
    document.getElementById('sb-home-foul').textContent = s.homeFoul ?? 0;
    document.getElementById('sb-away-foul').textContent = s.awayFoul ?? 0;

    // 타임아웃 (현재 쿼터 기준)
    const homeTOKey = q <= 2 ? 'homeTO_first' : (q >= 5 ? 'homeTO_ot' : 'homeTO_second');
    const awayTOKey = q <= 2 ? 'awayTO_first' : (q >= 5 ? 'awayTO_ot' : 'awayTO_second');
    const homeToMax = q <= 2 ? 2 : (q >= 5 ? 1 : 3);
    const awayToMax = q <= 2 ? 2 : (q >= 5 ? 1 : 3);
    document.getElementById('sb-home-to').textContent =
        `${s[homeTOKey] ?? 0}/${homeToMax}`;
    document.getElementById('sb-away-to').textContent =
        `${s[awayTOKey] ?? 0}/${awayToMax}`;

    // BONUS (4파울 이상 → 보너스)
    const homeBonus = (s.homeFoul || 0) >= 5 ? 'HOME' : '';
    const awayBonus = (s.awayFoul || 0) >= 5 ? 'AWAY' : '';
    const bonus = [homeBonus, awayBonus].filter(Boolean).join(' · ') || '—';
    const bonusEl = document.getElementById('sb-bonus');
    bonusEl.textContent = bonus;
    if (bonus !== '—') {
        bonusEl.style.fontSize = '28px';
        bonusEl.style.color = 'var(--accent-red)';
    } else {
        bonusEl.style.fontSize = '20px';
        bonusEl.style.color = 'var(--text-gray)';
    }
}

// Ops broker 수신 — operator에서 보낸 state를 메모리에 저장 후 렌더
Ops.subscribe('game_state', (data) => {
    if (data.gs) {
        _remoteState = data.gs;
        try { localStorage.setItem(SAVE_KEY, JSON.stringify(data.gs)); } catch {}
        render();
    }
});

// 시퀀스 타이머 — 중첩 시퀀스 방지
let _sequenceTimers = [];
function _clearSequence() {
    _sequenceTimers.forEach(t => clearTimeout(t));
    _sequenceTimers = [];
}
function _schedule(ms, fn) {
    _sequenceTimers.push(setTimeout(fn, ms));
}

function activateMode(modeName, payload) {
    document.querySelectorAll('.sb-mode').forEach(el => el.classList.remove('active'));
    const target = document.querySelector(`.sb-mode.mode-${modeName}`);
    if (target) target.classList.add('active');

    if (modeName === 'stats' && payload) {
        renderStatsLeaders(payload);
    } else if (modeName === 'var' && payload) {
        const video = document.getElementById('sb-var-video');
        const placeholder = document.getElementById('sb-var-placeholder');
        if (payload.clip_url) {
            video.src = payload.clip_url;
            video.style.display = '';
            placeholder.style.display = 'none';
        }
        document.getElementById('sb-var-title').textContent = payload.title || '판정 검토 중';
        document.getElementById('sb-var-caption').textContent = payload.caption || '';
    } else if (modeName === 'highlight' && payload) {
        const video = document.getElementById('sb-hl-video');
        document.getElementById('sb-hl-title').textContent = payload.title || '최고의 순간';
        document.getElementById('sb-hl-caption').textContent = payload.caption || '';

        if (payload.clip_url) {
            // 명시적 URL 지정 시
            video.src = payload.clip_url;
            video.load(); video.play().catch(() => {});
        } else {
            // 자동 fetch — DESK api_server 에서 최신 하이라이트 조회
            video.removeAttribute('src');
            fetchLatestHighlight().then(hl => {
                if (!hl) return;
                video.src = hl.video_url;
                video.load();
                video.play().catch(() => {});
                if (hl.description) {
                    document.getElementById('sb-hl-caption').textContent = hl.description;
                }
            }).catch(err => console.warn('[scoreboard] highlight fetch 실패', err));
        }
    }
}

// DESK api_server 에서 최신 하이라이트 1개 조회 (M2 자동 재생용)
async function fetchLatestHighlight() {
    const base = window.DESK_BASE_URL || '';  // 분리 배포 대비 (기본: 동일 origin)
    const url = `${base}/api/v1/video/highlights?limit=1`;
    try {
        const resp = await fetch(url, { credentials: 'omit' });
        if (!resp.ok) return null;
        const list = await resp.json();
        if (!Array.isArray(list) || list.length === 0) return null;
        const hl = list[0];
        // video_url 이 상대 경로면 DESK base 붙이기
        if (hl.video_url && !hl.video_url.startsWith('http')) {
            hl.video_url = base + hl.video_url;
        }
        return hl;
    } catch { return null; }
}

// 경기 종료 — 전광판 창 자동 닫기
Ops.subscribe('game_ended', (data) => {
    console.log('[scoreboard] 경기 종료 수신 — 창 닫기', data);
    setTimeout(() => { try { window.close(); } catch {} }, 400);
});

Ops.subscribe('scoreboard_mode', (data) => {
    console.log('[scoreboard] scoreboard_mode 수신', data);
    const modeName = data?.mode || 'score';

    // 시퀀스 실행 — 작전타임/쿼터 종료 단계별 자동 전환
    if (modeName === 'sequence') {
        _clearSequence();
        const seq = data.payload || {};
        console.log('[scoreboard] sequence 시작', seq);
        if (seq.type === 'timeout') {
            runTimeoutSequence(seq.team);
        } else if (seq.type === 'quarter_end') {
            runQuarterEndSequence(seq.quarter, seq.leaders);
        }
        return;
    }

    // 단순 모드 전환 — 진행 중인 시퀀스 취소
    _clearSequence();
    activateMode(modeName, data.payload);
});

// 작전타임 시퀀스: 10초 대기(스코어보드 유지) → 하이라이트
function runTimeoutSequence(team) {
    const teamName = team === 'home'
        ? (loadState().homeName || 'HOME')
        : (loadState().awayName || 'AWAY');
    activateMode('score');
    // 10초 후 하이라이트
    _schedule(10000, () => {
        activateMode('highlight', {
            title: `${teamName} TIMEOUT`,
            caption: '작전 타임',
            clip_url: null,  // 하이라이트 클립 자동 선택 (엔진 구현 시)
        });
    });
}

// 쿼터 종료 시퀀스: 10초 대기 → 팀 스탯 20초 → 리더 20초 → 하이라이트
function runQuarterEndSequence(quarter, leaders) {
    console.log('[scoreboard] runQuarterEndSequence', { quarter, leaders });
    activateMode('score');

    // Phase 1: 10초 스코어 유지
    _schedule(10000, () => {
        console.log('[scoreboard] Phase 2: 팀 스탯 20초');
        activateMode('stats', {
            pts: (leaders?.pts || []).slice(0, 1),
            ast: (leaders?.ast || []).slice(0, 1),
            threept: (leaders?.threept || []).slice(0, 1),
            _mode: 'team_summary',
        });
    });

    // Phase 3 (+30초 = 10+20): 20초 카테고리 리더 TOP3
    _schedule(30000, () => {
        console.log('[scoreboard] Phase 3: 리더 TOP3 20초');
        activateMode('stats', leaders || {});
    });

    // Phase 4 (+50초): 하이라이트 (다음 쿼터 시작까지)
    _schedule(50000, () => {
        console.log('[scoreboard] Phase 4: 하이라이트');
        activateMode('highlight', {
            title: `${quarter}Q 하이라이트`,
            caption: '다음 쿼터 시작 대기',
            clip_url: null,
        });
    });
}

function renderStatsLeaders(payload) {
    const s = loadState();
    document.getElementById('sb-stats-q-label').textContent = `${s.quarter >= 5 ? 'OT' : s.quarter + 'Q'} 종료`;
    document.getElementById('sb-stats-home-name').textContent = s.homeName || 'HOME';
    document.getElementById('sb-stats-away-name').textContent = s.awayName || 'AWAY';
    document.getElementById('sb-stats-home-score').textContent = s.homeScore || 0;
    document.getElementById('sb-stats-away-score').textContent = s.awayScore || 0;

    // payload: { pts:[{rank,name,team,value,sub}], ast:[...], threept:[...] }
    const categories = [
        ['pts', 'sb-leader-pts', '점'],
        ['ast', 'sb-leader-ast', '개'],
        ['threept', 'sb-leader-3p', '%'],
    ];
    categories.forEach(([key, elId, unit]) => {
        const el = document.getElementById(elId);
        const list = payload[key] || [];
        if (list.length === 0) {
            el.innerHTML = `
                <div style="text-align:center;color:var(--text-gray);padding:40px 20px;">
                    <div style="font-size:48px; opacity:0.3;">📊</div>
                    <div style="font-size:16px; margin-top:12px;">기록 수집 중...</div>
                    <div style="font-size:11px; margin-top:6px; opacity:0.7;">기록지에서 선수 스탯을 입력하면 표시됩니다</div>
                </div>`;
            return;
        }
        el.innerHTML = list.slice(0, 3).map((p, i) => `
            <div class="leader-row">
                <div class="leader-rank r${i+1}">${i+1}</div>
                <div>
                    <div class="leader-name">${p.name || '선수'}</div>
                    <div class="leader-team">${p.team || ''}${p.number ? ' · #' + p.number : ''}</div>
                </div>
                <div>
                    <div class="leader-value">${p.value}</div>
                    ${p.sub ? `<div class="leader-value-sub">${p.sub}</div>` : ''}
                </div>
            </div>
        `).join('');
    });
}

// 주기적 렌더 (clock이 gs 안에서 operator가 감소시키므로 여기선 단순 재렌더)
render();
setInterval(render, 500);
window.addEventListener('storage', (e) => {
    if (e.key === SAVE_KEY) render();
});

// 엔진 연결 상태 (끊기면 offline 배지)
async function checkSync() {
    try {
        const r = await fetch('/health');
        const data = await r.json();
        const off = document.getElementById('sb-offline');
        if (data.engine !== 'ok') {
            off.classList.add('show');
        } else {
            off.classList.remove('show');
        }
    } catch {
        document.getElementById('sb-offline').classList.add('show');
    }
}
checkSync();
setInterval(checkSync, 5000);

// 풀스크린 단축키 (F11 대신 F로)
document.addEventListener('keydown', (e) => {
    if (e.key === 'f' || e.key === 'F') {
        if (document.fullscreenElement) document.exitFullscreen();
        else document.documentElement.requestFullscreen();
    }
});
