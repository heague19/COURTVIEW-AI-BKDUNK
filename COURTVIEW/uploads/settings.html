{% extends "components/layout.html" %}
{% set active = "settings" %}
{% block title %}COURTVIEW — 설정{% endblock %}

{% block content %}
<div class="page-header">
    <div class="page-title">⚙️ 설정</div>
    <div class="page-subtitle">엔진 및 시스템 설정을 관리합니다</div>
</div>

<div style="display:grid; grid-template-columns:1fr 1fr; gap:16px;">
    <!-- 엔진 설정 -->
    <div class="card">
        <div class="card-title" style="margin-bottom:16px;">엔진 설정</div>
        <div class="form-group">
            <label class="form-label">엔진 서버 주소</label>
            <input type="text" class="form-input" value="http://localhost:8000" id="engine-url">
        </div>
        <div class="form-group">
            <label class="form-label">클라우드 서버 주소</label>
            <input type="text" class="form-input" value="http://107.21.157.92:8001/api/v1" id="cloud-url">
        </div>
        <div class="form-group">
            <label class="form-label">분석 모드</label>
            <select class="form-select" id="analysis-mode">
                <option value="live" selected>실시간 (LIVE)</option>
                <option value="batch">배치 (BATCH)</option>
            </select>
        </div>
    </div>

    <!-- 카메라 설정 -->
    <div class="card">
        <div class="card-title" style="margin-bottom:16px;">카메라 설정</div>
        <div class="form-group">
            <label class="form-label">카메라 수</label>
            <select class="form-select">
                <option value="1">1대</option>
                <option value="4">4대</option>
                <option value="8" selected>8대</option>
            </select>
        </div>
        <div class="form-group">
            <label class="form-label">분석 해상도</label>
            <select class="form-select">
                <option value="1080p" selected>1080p (1920×1080)</option>
            </select>
        </div>
        <div class="form-group">
            <label class="form-label">FPS</label>
            <select class="form-select">
                <option value="30" selected>30 fps</option>
                <option value="60">60 fps</option>
            </select>
        </div>
    </div>

    <!-- 데이터 설정 -->
    <div class="card">
        <div class="card-title" style="margin-bottom:16px;">데이터 설정</div>
        <label style="font-size:12px; color:var(--text-gray); cursor:pointer; display:flex; align-items:center; gap:6px; margin-bottom:12px;">
            <input type="checkbox" checked> 분석 결과 자동 Cloud 전송
        </label>
        <label style="font-size:12px; color:var(--text-gray); cursor:pointer; display:flex; align-items:center; gap:6px; margin-bottom:12px;">
            <input type="checkbox" checked> 로컬 JSON 백업 저장
        </label>
        <label style="font-size:12px; color:var(--text-gray); cursor:pointer; display:flex; align-items:center; gap:6px; margin-bottom:12px;">
            <input type="checkbox" checked> 학습 데이터 추출
        </label>
    </div>

    <!-- 정보 -->
    <div class="card">
        <div class="card-title" style="margin-bottom:16px;">시스템 정보</div>
        <div style="display:flex; flex-direction:column; gap:10px; font-size:12px;">
            <div style="display:flex; justify-content:space-between;">
                <span style="color:var(--text-gray);">UI 버전</span>
                <span>1.0.0</span>
            </div>
            <div style="display:flex; justify-content:space-between;">
                <span style="color:var(--text-gray);">엔진 버전</span>
                <span>1.0.0</span>
            </div>
            <div style="display:flex; justify-content:space-between;">
                <span style="color:var(--text-gray);">Python</span>
                <span>3.11</span>
            </div>
            <div style="display:flex; justify-content:space-between;">
                <span style="color:var(--text-gray);">CUDA</span>
                <span>12.8</span>
            </div>
        </div>
    </div>
</div>
{% endblock %}
