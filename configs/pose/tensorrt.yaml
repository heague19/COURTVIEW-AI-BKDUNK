# =============================================================================
# COURTVIEW_DESK - TensorRT 엔진 설정 (tensorrt.yaml)
#
# ONNX → TensorRT 엔진 빌더/캐싱 설정.
# YOLOv8x-Pose + ViTPose-B 공통 적용.
#
# 작성자: SPOIN_COURTVIEW
# 최종 수정: 2026-03-20
# 버전: 1.0.0
# =============================================================================

# -----------------------------------------------------------------------------
# 엔진 빌더 설정
# -----------------------------------------------------------------------------
# TODO: workspace_size 2048MB는 RTX 5060 8GB VRAM 기준 초기값,
#       GPU 모델에 따라 조정 필요 (gpu_config.yaml의 1024MB와 일관성 확인)
builder:
  workspace_size_mb: 2048
  optimization_level: 5                # 1~5
  precision: "fp16"                    # fp32, fp16, int8
  strict_type_constraints: false
  max_batch_size: 16
  min_timing_iterations: 3

# -----------------------------------------------------------------------------
# 동적 형상 (Dynamic Shapes)
# -----------------------------------------------------------------------------
dynamic_shapes:
  enabled: true
  # YOLOv8x-Pose
  yolov8:
    min_shape: [1, 3, 640, 640]
    opt_shape: [8, 3, 640, 640]
    max_shape: [16, 3, 640, 640]
  # ViTPose-B
  vitpose:
    min_shape: [1, 3, 256, 192]
    opt_shape: [4, 3, 256, 192]
    max_shape: [16, 3, 256, 192]

# -----------------------------------------------------------------------------
# 엔진 캐싱
# -----------------------------------------------------------------------------
cache:
  enabled: true
  cache_dir: "tensorrt_engines"
  # 엔진 파일명 규칙: {model_name}_{precision}_{gpu_name}.engine
  naming_pattern: "{model}_{precision}_{gpu}"
  rebuild_on_version_change: true
  rebuild_on_gpu_change: true
  max_cache_size_gb: 10

# -----------------------------------------------------------------------------
# INT8 캘리브레이션 (선택적)
# -----------------------------------------------------------------------------
int8_calibration:
  enabled: false
  calibration_images: 500
  calibration_batch_size: 8
  cache_file: "int8_calibration.cache"
  algorithm: "entropy"                 # entropy, minmax

# -----------------------------------------------------------------------------
# 프로파일링
# -----------------------------------------------------------------------------
profiling:
  enabled: false
  warmup_iterations: 10
  benchmark_iterations: 100
  export_timeline: false

# -----------------------------------------------------------------------------
# ONNX 변환
# -----------------------------------------------------------------------------
onnx:
  opset_version: 17
  simplify: true
  dynamic_axes: true
