# =============================================================================
# COURTVIEW_DESK - 카메라 설정 (camera_config.yaml)
#
# 멀티카메라 시스템 기본 설정.
# 최대 8대, 최적 4대 구성 기준.
#
# 작성자: SPOIN_COURTVIEW
# 최종 수정: 2026-03-20
# 버전: 1.0.0
# =============================================================================

# -----------------------------------------------------------------------------
# 카메라 시스템 기본값
# -----------------------------------------------------------------------------
camera_system:
  min_cameras: 1
  optimal_count: 4
  max_cameras: 8

# -----------------------------------------------------------------------------
# 해상도 및 프레임레이트
# -----------------------------------------------------------------------------
resolution:
  default: [1920, 1080]
  min: [640, 480]
  max: [3840, 2160]
  training_recommended: [1920, 1080]
  game_recommended: [1920, 1080]

frame_rate:
  default: 30
  min: 15
  max: 120
  motion_analysis: 60
  game_analysis: 30
  slow_motion: 120

# -----------------------------------------------------------------------------
# 카메라 배치 (설치 위치)
# -----------------------------------------------------------------------------
placement:
  height_optimal_m: 6.0
  height_min_m: 3.0
  height_max_m: 12.0
  distance_optimal_m: 15.0
  distance_min_m: 8.0
  distance_max_m: 30.0
  fov_optimal_deg: 90.0
  fov_min_deg: 60.0
  fov_max_deg: 120.0
  tilt_min_deg: -45.0
  tilt_max_deg: 45.0

# -----------------------------------------------------------------------------
# 동기화 설정
# -----------------------------------------------------------------------------
sync:
  tolerance_ms: 33.33                  # 1 프레임 @ 30fps
  hardware_jitter_ms: 1.0             # Genlock 하드웨어 동기화 오차
  software_jitter_ms: 5.0             # 소프트웨어 동기화 오차
  drift_threshold_ms: 50.0            # 재동기화 트리거 임계값
  max_drift_before_reset_ms: 100.0

# -----------------------------------------------------------------------------
# 캘리브레이션 설정
# -----------------------------------------------------------------------------
calibration:
  chessboard_size: [9, 6]
  square_size_mm: 25.0
  min_images: 20
  max_images: 100
  reprojection_error_threshold: 0.5
  cache_ttl_sec: 3600.0               # 1시간
  auto_recalibrate: false

# -----------------------------------------------------------------------------
# 멀티뷰 융합
# -----------------------------------------------------------------------------
multi_view:
  triangulation_method: "svd"          # svd, dlt
  min_views_for_triangulation: 2
  max_reprojection_error_px: 5.0
  court_margin_m: 2.0
  court_height_min_m: 0.0
  court_height_max_m: 4.0
