# =============================================================================
# COURTVIEW AI Referee — 데이터 추출 설정
# 파일: configs/ai_referee/data_extraction.yaml
# 설명: Phase E 추출기 6종의 버퍼/임계치/샘플링 설정
# =============================================================================

# ---------------------------------------------------------------------------
# 공통 설정
# ---------------------------------------------------------------------------
common:
  max_extractions: 200              # 추출 세션 최대 수
  max_records_per_extraction: 50000 # 세션당 최대 레코드 수
  s3_bucket: "courtview-referee-data"
  s3_prefix: "data_extraction/ai_referee"

# ---------------------------------------------------------------------------
# 1. DecisionRecordExtractor — 전체 판정 기록
# ---------------------------------------------------------------------------
decision_record:
  # 콜 레코드는 전수 수집, 노콜은 샘플링
  no_call_sampling_ratio: 0.33      # 콜 대비 노콜 샘플링 비율 (3:1)
  min_confidence_for_no_call: 0.30  # 노콜 수집 최소 신뢰도 (너무 낮은 것 제외)

# ---------------------------------------------------------------------------
# 2. CorrectionPairExtractor — AI판정 vs 인간교정 쌍
# ---------------------------------------------------------------------------
correction_pair:
  # 교정 소스별 가중치 (학습 시 샘플 가중에 사용)
  source_weights:
    replay_overturn: 1.0
    coach_challenge: 0.9
    manual_review: 0.8
  # 교정 이벤트 최대 대기 시간 (초) — 판정 후 이 시간 내 교정이 없으면 CONFIRMED 처리
  confirmation_timeout_sec: 300.0

# ---------------------------------------------------------------------------
# 3. EdgeCaseExtractor — 저신뢰도 경계 케이스
# ---------------------------------------------------------------------------
edge_case:
  # 캡처 기준 임계치
  max_confidence: 0.85              # 이 이하만 캡처 (AUTO_CONFIRM 미달)
  min_confidence: 0.40              # 이 이상만 캡처 (너무 낮은 것 제외)
  max_multi_angle_agreement: 0.75   # 동의율 이 이하 캡처
  max_consistency_score: 0.70       # 일관성 이 이하 캡처
  # 라벨링 우선순위 가중치
  priority_weights:
    confidence_inverse: 0.40        # 신뢰도 역수 가중치
    agreement_inverse: 0.30         # 동의율 역수 가중치
    severity: 0.30                  # 심각도 가중치

# ---------------------------------------------------------------------------
# 4. CalibrationDataExtractor — 신뢰도 보정 데이터
# ---------------------------------------------------------------------------
calibration:
  bin_width: 0.05                   # 신뢰도 빈 구간 너비
  min_samples_per_bin: 30           # 빈당 최소 샘플 수 (캘리브레이션 유효 기준)

# ---------------------------------------------------------------------------
# 5. FoulContactExtractor — 접촉+파울 라벨 쌍
# ---------------------------------------------------------------------------
foul_contact:
  # 키포인트 시계열 범위 (접촉 프레임 기준)
  sequence_frames_before: 3         # 접촉 전 프레임 수
  sequence_frames_after: 3          # 접촉 후 프레임 수
  # 노파울 접촉도 수집 (네거티브 샘플)
  collect_no_foul_contacts: true
  min_impact_for_no_foul: 5.0       # 노파울 수집 최소 충격 가속도 (m/s²)

# ---------------------------------------------------------------------------
# 6. ViolationSequenceExtractor — 바이올레이션 시계열
# ---------------------------------------------------------------------------
violation_sequence:
  # 시퀀스 길이 (프레임)
  frames_before: 30                 # 위반 전 프레임 수
  frames_after: 10                  # 위반 후 프레임 수
  # 정상 시퀀스 네거티브 샘플링
  negative_sampling_ratio: 0.10     # 위반 대비 정상 비율 (10:1)
  min_negative_interval: 90         # 정상 샘플 최소 간격 (프레임)
