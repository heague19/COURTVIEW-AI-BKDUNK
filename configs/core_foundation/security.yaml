# =============================================================================
# COURTVIEW - AI 농구 분석 플랫폼
# Core Foundation - 보안 모듈 설정
# 파일: configs/core_foundation/security.yaml
# =============================================================================

# -----------------------------------------------------------------------------
# 시크릿 관리 (SecretManager)
# -----------------------------------------------------------------------------
secret_manager:
  # 활성화
  enabled: true

  # 제공자 설정
  provider:
    # 기본 제공자: aws, vault, env, file
    default: "env"

    # AWS Secrets Manager
    aws:
      enabled: false
      region: "ap-northeast-2"
      # 캐시 TTL (초)
      cache_ttl: 300
      # 자동 로테이션 감지
      auto_rotation: true
      # 접두사
      prefix: "courtview/"

    # HashiCorp Vault
    vault:
      enabled: false
      address: "http://localhost:8200"
      # 인증 방식: token, approle, kubernetes
      auth_method: "token"
      # 시크릿 경로
      secret_path: "secret/data/courtview"
      # 캐시 TTL (초)
      cache_ttl: 300

    # 환경변수
    env:
      enabled: true
      # 접두사
      prefix: "COURTVIEW_SECRET_"
      # 대소문자 처리
      case_sensitive: false

    # 파일 (개발용)
    file:
      enabled: false
      path: "secrets/.secrets.yaml"
      # 파일 암호화
      encrypted: true

  # 시크릿 캐싱
  cache:
    enabled: true
    # 기본 TTL (초)
    ttl: 300
    # 최대 캐시 항목 수
    max_entries: 100
    # 백그라운드 갱신
    background_refresh: true
    # 갱신 임계값 (TTL의 %)
    refresh_threshold: 80

  # 시크릿 유효성 검증
  validation:
    # 로드 시 검증
    on_load: true
    # 필수 시크릿
    required:
      - "database_password"
      - "redis_password"
      - "jwt_secret"
    # 형식 검증
    format_rules:
      jwt_secret:
        min_length: 32
      database_password:
        min_length: 12

  # 시크릿 로테이션
  rotation:
    enabled: false
    # 체크 간격 (초)
    check_interval: 3600
    # 로테이션 알림
    notify_on_rotation: true

  # 로깅 (민감정보 마스킹)
  logging:
    # 시크릿 접근 로깅
    log_access: true
    # 시크릿 값 마스킹
    mask_values: true
    # 마스킹 문자
    mask_char: "*"

# -----------------------------------------------------------------------------
# 감사 로깅 (AuditLogger)
# -----------------------------------------------------------------------------
audit_logger:
  # 활성화
  enabled: true

  # 감사 이벤트 타입
  event_types:
    authentication:
      label: "인증"
      severity: "info"
      events:
        - "login_success"
        - "login_failure"
        - "logout"
        - "token_refresh"
        - "password_change"

    authorization:
      label: "권한"
      severity: "warning"
      events:
        - "access_granted"
        - "access_denied"
        - "permission_change"
        - "role_change"

    data_access:
      label: "데이터 접근"
      severity: "info"
      events:
        - "data_read"
        - "data_create"
        - "data_update"
        - "data_delete"

    configuration:
      label: "설정 변경"
      severity: "warning"
      events:
        - "config_change"
        - "secret_access"
        - "secret_rotation"

    system:
      label: "시스템"
      severity: "info"
      events:
        - "service_start"
        - "service_stop"
        - "health_check"
        - "error_occurred"

    security:
      label: "보안"
      severity: "critical"
      events:
        - "intrusion_detected"
        - "rate_limit_exceeded"
        - "invalid_token"
        - "suspicious_activity"

  # 감사 심각도
  severity_levels:
    debug:
      value: 10
      retain_days: 7
    info:
      value: 20
      retain_days: 30
    warning:
      value: 30
      retain_days: 90
    error:
      value: 40
      retain_days: 180
    critical:
      value: 50
      retain_days: 365

  # 저장소 설정
  storage:
    # 파일 저장
    file:
      enabled: true
      path: "logs/audit"
      # 로테이션
      rotation:
        type: "daily"
        max_files: 90
        compress: true
      # 형식
      format: "json"

    # 데이터베이스 저장
    database:
      enabled: false
      table: "audit_logs"
      # 파티셔닝
      partition_by: "month"

    # 외부 SIEM
    siem:
      enabled: false
      # Splunk, ELK, etc.
      type: "splunk"
      endpoint: ""
      # 버퍼링
      buffer_size: 100
      flush_interval_seconds: 10

  # 감사 로그 포함 필드
  fields:
    required:
      - "timestamp"
      - "event_type"
      - "severity"
      - "actor"
      - "action"
      - "resource"
      - "result"
    optional:
      - "ip_address"
      - "user_agent"
      - "request_id"
      - "session_id"
      - "details"

  # 필터링
  filtering:
    # 제외 이벤트
    exclude_events:
      - "health_check"
    # 최소 심각도
    min_severity: "info"
    # 샘플링 (debug 레벨)
    sampling:
      enabled: true
      rate: 0.1  # 10%
      levels:
        - "debug"

  # 변조 방지
  integrity:
    enabled: true
    # 해시 알고리즘
    hash_algorithm: "sha256"
    # 체인 해시 (이전 로그 연결)
    chain_hash: true

  # 알림
  alerting:
    enabled: true
    # 즉시 알림 이벤트
    immediate_alerts:
      - "intrusion_detected"
      - "suspicious_activity"
      - "login_failure_threshold"
    # 로그인 실패 임계값
    login_failure_threshold: 5
    # 임계값 윈도우 (분)
    threshold_window_minutes: 15

# -----------------------------------------------------------------------------
# 접근 제어
# -----------------------------------------------------------------------------
access_control:
  # API 키 관리
  api_keys:
    enabled: true
    # 키 길이
    key_length: 32
    # 키 접두사
    prefix: "cvk_"
    # 기본 만료 기간 (일)
    default_expiry_days: 365
    # 최대 키 수 (사용자당)
    max_keys_per_user: 5

  # IP 화이트리스트/블랙리스트
  ip_filtering:
    enabled: false
    # 모드: whitelist, blacklist
    mode: "blacklist"
    whitelist: []
    blacklist: []

  # 요청 제한
  rate_limiting:
    enabled: true
    # 기본 제한
    default:
      requests_per_minute: 100
      burst: 150
    # 인증된 사용자
    authenticated:
      requests_per_minute: 500
      burst: 750
    # 관리자
    admin:
      requests_per_minute: 1000
      burst: 1500

# -----------------------------------------------------------------------------
# 데이터 보호
# -----------------------------------------------------------------------------
data_protection:
  # 암호화 설정
  encryption:
    # 대칭 키 알고리즘
    symmetric:
      algorithm: "AES-256-GCM"
      key_rotation_days: 90
    # 해시 알고리즘
    hashing:
      algorithm: "bcrypt"
      rounds: 12

  # 민감 데이터 처리
  sensitive_data:
    # PII 필드
    pii_fields:
      - "email"
      - "phone"
      - "name"
      - "address"
    # 로그 마스킹
    mask_in_logs: true
    # 익스포트 마스킹
    mask_in_export: true

  # 데이터 보관
  retention:
    # 사용자 데이터 (일)
    user_data: 365
    # 분석 데이터 (일)
    analysis_data: 180
    # 로그 데이터 (일)
    log_data: 90
    # 삭제 정책
    deletion:
      # 소프트 삭제
      soft_delete: true
      # 하드 삭제 대기 (일)
      hard_delete_after: 30
