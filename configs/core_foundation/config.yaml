# =============================================================================
# COURTVIEW - AI 농구 분석 플랫폼
# Core Foundation - 설정 관리 모듈 설정
# 파일: configs/core_foundation/config.yaml
# =============================================================================

# -----------------------------------------------------------------------------
# 설정 로더 (ConfigLoader)
# -----------------------------------------------------------------------------
loader:
  # 환경변수 접두사
  env_prefix: "COURTVIEW_"

  # 기본 설정 검색 경로
  search_paths:
    - "configs"
    - "config"
    - "settings"
    - "."

  # 지원 파일 형식
  supported_formats:
    yaml:
      extensions:
        - ".yaml"
        - ".yml"
    json:
      extensions:
        - ".json"

  # 프로파일 설정
  profiles:
    # 기본 프로파일
    default: "development"
    # 환경변수로 오버라이드
    env_var: "COURTVIEW_PROFILE"
    # 지원 프로파일
    supported:
      - "development"
      - "staging"
      - "production"
      - "testing"

  # 병합 설정
  merge:
    # 딥 머지 활성화
    deep_merge: true
    # 배열 병합 전략: replace, append, merge
    array_strategy: "replace"
    # null 값 처리: keep, remove, override
    null_handling: "override"

  # 캐싱 설정
  cache:
    enabled: true
    # 캐시 TTL (초, 0이면 무제한)
    ttl: 0

# -----------------------------------------------------------------------------
# 스키마 검증 (SchemaValidator)
# -----------------------------------------------------------------------------
validator:
  # 검증 활성화
  enabled: true

  # 엄격 모드 (알 수 없는 필드 거부)
  strict_mode: false

  # 타입 강제 변환
  coerce_types: true

  # 기본값 적용
  apply_defaults: true

  # 검증 오류 처리
  on_error:
    # 첫 번째 오류에서 중단
    fail_fast: false
    # 최대 오류 수
    max_errors: 50

  # 커스텀 검증기 등록
  custom_validators:
    enabled: true
    # 검증기 검색 경로
    paths:
      - "validators"

# -----------------------------------------------------------------------------
# 핫 리로드 (HotReloadManager)
# -----------------------------------------------------------------------------
hot_reload:
  # 핫 리로드 활성화
  enabled: true

  # 감시 대상 디렉토리
  watch_directories:
    - "configs"

  # 감시 대상 파일 패턴
  watch_patterns:
    - "*.yaml"
    - "*.yml"
    - "*.json"

  # 무시 패턴
  ignore_patterns:
    - "*.tmp"
    - "*.bak"
    - ".*"
    - "__pycache__"

  # 디바운스 시간 (밀리초)
  # 짧은 시간 내 여러 변경을 하나로 처리
  debounce_ms: 500

  # 리로드 후 콜백 타임아웃 (초)
  callback_timeout: 30

  # 리로드 실패 시 동작
  on_failure:
    # 이전 설정 유지
    keep_previous: true
    # 최대 재시도 횟수
    max_retries: 3
    # 재시도 간격 (초)
    retry_interval: 5

  # 알림 설정
  notifications:
    # 리로드 성공 시 로그
    log_success: true
    # 리로드 실패 시 로그
    log_failure: true
    # 로그 레벨
    log_level: "INFO"

# -----------------------------------------------------------------------------
# 환경변수 오버라이드 규칙
# -----------------------------------------------------------------------------
env_override:
  # 활성화
  enabled: true

  # 구분자 (중첩 키 표현)
  # COURTVIEW_DATABASE_HOST -> database.host
  separator: "_"

  # 대소문자 처리
  case_sensitive: false

  # 타입 추론
  type_inference:
    enabled: true
    # 불리언 값
    boolean_true:
      - "true"
      - "yes"
      - "1"
      - "on"
    boolean_false:
      - "false"
      - "no"
      - "0"
      - "off"

# -----------------------------------------------------------------------------
# 비밀 값 처리
# -----------------------------------------------------------------------------
secrets:
  # 마스킹 대상 키워드
  mask_keywords:
    - "password"
    - "secret"
    - "key"
    - "token"
    - "credential"
    - "api_key"
    - "private"

  # 로그 출력 시 마스킹
  mask_in_logs: true

  # 마스킹 문자
  mask_char: "*"
  mask_length: 8

# -----------------------------------------------------------------------------
# 설정 내보내기
# -----------------------------------------------------------------------------
export:
  # 내보내기 형식
  formats:
    - "yaml"
    - "json"
    - "env"

  # 비밀 값 제외
  exclude_secrets: true

  # 기본 값 포함
  include_defaults: false

# -----------------------------------------------------------------------------
# 로깅
# -----------------------------------------------------------------------------
logging:
  # 설정 로드 로깅
  log_load: true
  # 설정 변경 로깅
  log_changes: true
  # 환경변수 오버라이드 로깅
  log_env_overrides: true
  # 로그 레벨
  level: "DEBUG"
