# =============================================================================
# COURTVIEW - AI 농구 분석 플랫폼
# Core Foundation - 레지스트리 모듈 설정
# 파일: configs/core_foundation/registry.yaml
# =============================================================================

# -----------------------------------------------------------------------------
# 모델 레지스트리 (ModelRegistry)
# -----------------------------------------------------------------------------
model_registry:
  # 모델 저장 경로
  storage:
    # 로컬 모델 경로
    local_path: "models"
    # 원격 모델 저장소 (S3)
    remote:
      enabled: true
      bucket: "courtview-models"
      prefix: "registry"

  # 모델 타입 정의
  model_types:
    yolo:
      label: "YOLO Object Detection"
      extensions:
        - ".pt"
        - ".onnx"
      loader: "ultralytics"

    mediapipe:
      label: "MediaPipe Pose"
      extensions:
        - ".tflite"
        - ".task"
      loader: "mediapipe"

    onnx:
      label: "ONNX Runtime"
      extensions:
        - ".onnx"
      loader: "onnxruntime"

    tensorrt:
      label: "TensorRT Engine"
      extensions:
        - ".engine"
        - ".trt"
      loader: "tensorrt"

  # 버전 관리
  versioning:
    # 버전 형식: semantic, timestamp, incremental
    format: "semantic"
    # 최대 버전 보관 수
    max_versions: 5
    # 이전 버전 자동 정리
    auto_cleanup: true

  # 모델 로딩 설정
  loading:
    # 지연 로딩 (필요 시 로드)
    lazy_load: true
    # 사전 로드 모델
    preload:
      - "player_detection"
      - "pose_estimation"
    # 로드 타임아웃 (초)
    timeout: 60
    # 동시 로드 최대 수
    max_concurrent: 2

  # 모델 언로딩 설정
  unloading:
    # 유휴 시간 후 언로드 (초, 0이면 비활성화)
    idle_timeout: 300
    # 메모리 부족 시 자동 언로드
    on_memory_pressure: true
    # 최소 유지 모델 수
    min_loaded: 1

  # 모델 검증
  validation:
    # 로드 시 검증
    on_load: true
    # 체크섬 검증
    checksum: true
    # 추론 테스트
    inference_test: true

  # 메트릭 수집
  metrics:
    enabled: true
    # 추론 시간 추적
    track_inference_time: true
    # 메모리 사용량 추적
    track_memory: true

# -----------------------------------------------------------------------------
# 서비스 레지스트리 (ServiceRegistry)
# -----------------------------------------------------------------------------
service_registry:
  # 서비스 타입 정의
  service_types:
    detector:
      label: "Detector Service"
      interface: "IDetector"

    analyzer:
      label: "Analyzer Service"
      interface: "IAnalyzer"

    tracker:
      label: "Tracker Service"
      interface: "ITracker"

    storage:
      label: "Storage Service"
      interface: "IStorage"

    cache:
      label: "Cache Service"
      interface: "ICache"

    queue:
      label: "Queue Service"
      interface: "IQueue"

  # 서비스 라이프사이클
  lifecycle:
    # 시작 순서 (낮을수록 먼저)
    startup_order:
      storage: 10
      cache: 20
      queue: 30
      detector: 40
      analyzer: 50
      tracker: 60

    # 종료 역순
    shutdown_reverse: true

    # 시작 타임아웃 (초)
    startup_timeout: 30

    # 종료 타임아웃 (초)
    shutdown_timeout: 15

    # 그레이스풀 종료
    graceful_shutdown: true

  # 서비스 디스커버리
  discovery:
    # 자동 등록
    auto_register: true
    # 검색 경로
    scan_paths:
      - "services"
      - "adapters"
    # 헬스 체크 간격 (초)
    health_check_interval: 30

  # 서비스 의존성
  dependencies:
    # 순환 의존성 감지
    detect_circular: true
    # 선택적 의존성 허용
    allow_optional: true
    # 누락된 의존성 처리: error, warn, ignore
    on_missing: "error"

# -----------------------------------------------------------------------------
# 의존성 주입 (DIContainer)
# -----------------------------------------------------------------------------
dependency_injection:
  # 스코프 정의
  scopes:
    singleton:
      label: "싱글톤"
      description: "애플리케이션 수명 동안 단일 인스턴스"

    transient:
      label: "트랜지언트"
      description: "요청 시마다 새 인스턴스"

    scoped:
      label: "스코프드"
      description: "요청 스코프 내 단일 인스턴스"

  # 기본 스코프
  default_scope: "singleton"

  # 자동 와이어링
  auto_wiring:
    enabled: true
    # 타입 힌트 기반 주입
    by_type_hint: true
    # 이름 기반 주입
    by_name: false

  # 라이프사이클 훅
  lifecycle_hooks:
    on_create:
      enabled: true
      # 메서드명
      method: "on_create"

    on_destroy:
      enabled: true
      method: "on_destroy"

  # 순환 의존성 처리
  circular_dependency:
    # 감지
    detect: true
    # 처리: error, lazy_proxy, warn
    strategy: "error"

  # 스레드 안전
  thread_safety:
    enabled: true
    # 락 타임아웃 (초)
    lock_timeout: 10

# -----------------------------------------------------------------------------
# 파이프라인 코디네이터 (PipelineCoordinator)
# -----------------------------------------------------------------------------
pipeline:
  # 파이프라인 타입
  types:
    training:
      label: "훈련 분석 파이프라인"
      stages:
        - "video_load"
        - "frame_extraction"
        - "player_detection"
        - "pose_estimation"
        - "motion_analysis"
        - "feedback_generation"

    game:
      label: "경기 분석 파이프라인"
      stages:
        - "video_load"
        - "frame_extraction"
        - "player_detection"
        - "ball_detection"
        - "court_detection"
        - "tracking"
        - "event_detection"
        - "stats_generation"
        - "highlight_extraction"

    referee:
      label: "AI 심판 파이프라인"
      stages:
        - "video_load"
        - "frame_extraction"
        - "player_detection"
        - "ball_detection"
        - "court_detection"
        - "tracking"
        - "violation_detection"
        - "ruling_generation"

  # 스테이지 설정
  stages:
    # 기본 타임아웃 (초)
    default_timeout: 60
    # 스테이지별 재시도
    retry:
      enabled: true
      max_attempts: 3
      backoff_multiplier: 2.0
    # 에러 처리
    on_error:
      # 전체 중단
      abort_pipeline: false
      # 다음 스테이지로 스킵
      skip_to_next: true

  # 병렬 처리
  parallelism:
    # 병렬 스테이지 활성화
    enabled: true
    # 최대 병렬 스테이지
    max_parallel: 4
    # 워커 풀 크기
    worker_pool_size: 8

  # 진행 상태 추적
  progress:
    enabled: true
    # 업데이트 간격 (밀리초)
    update_interval_ms: 100
    # 콜백 활성화
    callbacks: true

  # 체크포인트
  checkpointing:
    enabled: true
    # 체크포인트 저장 경로
    storage_path: "checkpoints"
    # 자동 저장 간격 (스테이지 수)
    interval: 2
    # 복구 활성화
    recovery: true

  # 메트릭
  metrics:
    enabled: true
    # 스테이지별 시간 추적
    track_stage_time: true
    # 전체 파이프라인 시간 추적
    track_total_time: true
    # 처리량 추적
    track_throughput: true
