# =============================================================================
# COURTVIEW_DESK - 이벤트 감지 설정 (event_detection.yaml)
#
# 경기 중 발생하는 모든 이벤트의 감지 기준값.
# 16개 이벤트 감지기의 파라미터 통합 관리.
#
# 학술 근거:
#   - 슛 릴리스 각도/속도: Miller, S. & Bartlett, R. (1996). "The Relationship
#     Between Basketball Shooting Kinematics, Distance and Playing Position."
#     J. Sports Sciences, 14(3), 243-253.
#   - 접촉 감지 가속도: McNitt-Gray, J.L. (1993). J. Biomechanics, 26(9).
#   - 코트 규격 (3점 라인): FIBA Rule Book (2020), NBA Rule Book (2023-24)
#
# 참조 상수:
#   - shared/constants/event_types.py: EventType (93종)
#   - shared/constants/game_rule_constants.py: ShotType, ViolationType, FoulType
#   - shared/constants/stats_constants.py: ShotZone, FAST_BREAK_MAX_SEC
#   - shared/constants/game_management_constants.py: SHOT_CLOCK_FULL_SEC
#
# 작성자: SPOIN_COURTVIEW
# 최종 수정: 2026-03-20
# 버전: 1.0.0
# =============================================================================

# -----------------------------------------------------------------------------
# 슛 감지 (shot_event_detector.py)
# -----------------------------------------------------------------------------
shot_detection:
  # 슛 릴리스 감지 기준
  # 참고: Miller & Bartlett (1996) — 슈팅 팔꿈치 신전 ~120-170°
  # TODO: 릴리스 감지 파라미터(손목 높이차, 팔꿈치 각도, 각속도)는
  #       학술 범위 내 초기 설계값, 실제 포즈 추정 데이터로 캘리브레이션 필요
  release_detection:
    wrist_above_shoulder_min_m: 0.1         # 손목-어깨 높이차 최소값 (미터)
    elbow_extension_min_deg: 120            # 팔꿈치 신전 최소 각도 (Miller & Bartlett: 120-170°)
    arm_velocity_min_degs: 300.0            # 팔 각속도 최소 (도/초)
    release_height_min_ratio: 0.9           # 키 대비 릴리스 높이 최소 비율
    min_shooting_motion_frames: 4           # 슈팅 모션 최소 프레임 수

  # 슛 결과 판정
  result_detection:
    ball_rim_proximity_m: 0.3               # 공-림 근접 판정 거리 (미터)
    made_shot_confidence: 0.85              # 성공 판정 최소 신뢰도
    rim_contact_detection: true             # 림 접촉 감지 활성화
    net_motion_threshold: 0.5               # 네트 흔들림 임계값 (정규화)
    backboard_contact_detection: true       # 백보드 접촉 감지

  # 슛 유형 분류
  type_classification:
    layup_max_distance_m: 2.0               # 레이업 최대 거리
    dunk_min_height_ratio: 1.05             # 덩크 최소 높이 (림 대비)
    floater_height_range_m: [2.5, 4.0]      # 플로터 릴리스 높이 범위
    hook_shot_arm_angle_deg: 90.0           # 훅샷 팔 각도 기준
    three_point_distance_fiba_m: 6.75       # FIBA 3점 라인
    three_point_distance_nba_m: 7.24        # NBA 3점 라인
    catch_and_shoot_max_touch_sec: 2.0      # 캐치앤슛 최대 터치 시간
    pull_up_min_dribbles: 1                 # 풀업 점퍼 최소 드리블

  # 멀티뷰 융합
  multi_view:
    min_cameras_for_confirmation: 2         # 확인에 필요한 최소 카메라 수
    angle_disagreement_max_deg: 15.0        # 각도 불일치 허용 범위

# -----------------------------------------------------------------------------
# 득점 감지 (score_event_detector.py)
# -----------------------------------------------------------------------------
score_detection:
  # 득점 확인 조건
  confirmation:
    min_confidence: 0.90                    # 최소 신뢰도
    require_ball_through_hoop: true         # 공 통과 확인 필수
    net_deflection_required: true           # 네트 변형 확인
    max_latency_frames: 5                   # 최대 판정 지연 (프레임)

  # 득점 유형 배점
  points:
    free_throw: 1
    two_pointer: 2
    three_pointer: 3

  # 자유투 판정
  free_throw:
    shooter_in_arc: true                    # 슈터 프리스로 라인 내 확인
    max_motion_before_release_m: 0.3        # 릴리스 전 최대 이동량

# -----------------------------------------------------------------------------
# 리바운드 감지 (rebound_event_detector.py)
# -----------------------------------------------------------------------------
rebound_detection:
  # 리바운드 판정 조건
  trigger:
    after_missed_shot: true                 # 미스 후에만 카운트
    max_time_after_miss_sec: 5.0            # 미스 후 최대 인정 시간
    ball_control_min_frames: 3              # 공 확보 최소 프레임

  # 유형 분류
  classification:
    offensive_rebound: true                 # 공격 리바운드 구분
    defensive_rebound: true                 # 수비 리바운드 구분
    team_rebound: true                      # 팀 리바운드 (아웃)
    tip_chain_max_interval_sec: 1.5         # 연속 팁 인정 최대 간격
    long_rebound_distance_m: 4.0            # 장거리 리바운드 기준

  # 박스아웃 감지
  box_out:
    detection_enabled: true
    effective_distance_m: 1.5               # 박스아웃 유효 거리
    reaction_time_after_shot_sec: 0.5       # 슛 후 반응 시간 기준

# -----------------------------------------------------------------------------
# 어시스트 감지 (assist_event_detector.py)
# -----------------------------------------------------------------------------
assist_detection:
  # 어시스트 조건
  criteria:
    max_dribbles_after_pass: 1              # 패스 후 최대 드리블 수
    max_time_after_pass_sec: 4.0            # 패스 후 최대 시간
    must_result_in_made_shot: true           # 슛 성공 필수
    pass_must_create_advantage: true        # 수비 이점 생성 확인

  # 잠재적 어시스트 (2차 스탯)
  secondary:
    potential_assist_enabled: true           # 잠재적 어시스트 활성화
    hockey_assist_enabled: true             # 하키 어시스트 (2차 패스)
    free_throw_assist_enabled: true         # 자유투 어시스트

# -----------------------------------------------------------------------------
# 스틸 감지 (steal_event_detector.py)
# -----------------------------------------------------------------------------
steal_detection:
  criteria:
    ball_possession_change: true            # 점유 변경 필수
    defensive_action_required: true         # 수비 행위 확인
    max_possession_gap_frames: 10           # 점유 전환 최대 프레임 갭
    min_steal_confidence: 0.75              # 최소 스틸 신뢰도

  # 스틸 유형
  types:
    - "on_ball_steal"                       # 볼 핸들러 스틸
    - "passing_lane_steal"                  # 패싱 레인 가로채기
    - "post_steal"                          # 포스트 스틸

# -----------------------------------------------------------------------------
# 블록 감지 (block_event_detector.py)
# -----------------------------------------------------------------------------
block_detection:
  criteria:
    hand_ball_contact_proximity_m: 0.3      # 손-공 접촉 근접 거리
    ball_trajectory_change: true            # 공 궤적 변화 확인
    during_shot_attempt: true               # 슛 시도 중 발생
    min_block_confidence: 0.80              # 최소 블록 신뢰도

  # 블록 유형
  types:
    - "chase_down"                          # 뒤쫓아가 블록
    - "weakside_block"                      # 약사이드 블록
    - "post_block"                          # 포스트 블록
    - "perimeter_block"                     # 외곽 블록

# -----------------------------------------------------------------------------
# 턴오버 감지 (turnover_event_detector.py)
# -----------------------------------------------------------------------------
turnover_detection:
  # 턴오버 판정 조건
  criteria:
    possession_lost: true                   # 점유 상실
    min_confidence: 0.70                    # 최소 신뢰도
    exclude_end_of_period: true             # 쿼터 종료 시 제외

  # 세부 18종 분류
  types:
    - "bad_pass"                            # 패스 실수
    - "lost_ball"                           # 볼 놓침
    - "traveling"                           # 트래블링
    - "double_dribble"                      # 더블 드리블
    - "carry"                               # 캐리
    - "backcourt_violation"                 # 백코트
    - "shot_clock_violation"                # 슛클락 (24초)
    - "3_second_violation"                  # 3초
    - "5_second_violation"                  # 5초
    - "8_second_violation"                  # 8초
    - "offensive_foul"                      # 공격 파울
    - "out_of_bounds"                       # 아웃 오브 바운즈
    - "kick_ball_violation"                 # 킥볼
    - "goaltending_offensive"               # 공격 골텐딩
    - "illegal_screen"                      # 불법 스크린
    - "offensive_goaltending"               # 공격 골텐딩
    - "palming"                             # 팔밍
    - "lane_violation"                      # 레인 바이올레이션

  # 강제/비강제 분류 기준
  forced_classification:
    defender_proximity_m: 1.5               # 수비자 근접 거리
    steal_precedes: true                    # 스틸 선행 확인

# -----------------------------------------------------------------------------
# 파울 감지 (foul_event_detector.py)
# -----------------------------------------------------------------------------
foul_detection:
  # 접촉 감지 기준
  # TODO: 파울 접촉 감지 파라미터(겹침 임계값, 속도 변화, 가속도 급변)는
  #       초기 설계값, 실제 접촉 감지 데이터 축적 후 캘리브레이션 필요
  contact:
    body_overlap_threshold: 0.3             # 신체 겹침 임계값
    velocity_change_threshold_ms: 1.5       # 접촉 후 속도 변화
    acceleration_spike_ms2: 15.0            # 가속도 급변 (충격)
    min_contact_duration_frames: 2          # 최소 접촉 지속

  # 파울 유형 분류 (11종)
  types:
    - "personal"                            # 개인 파울
    - "shooting"                            # 슈팅 파울
    - "offensive"                           # 공격 파울 (차징)
    - "blocking"                            # 블로킹
    - "hand_check"                          # 핸드체크
    - "holding"                             # 홀딩
    - "illegal_screen"                      # 불법 스크린
    - "reach_in"                            # 리치인
    - "flagrant_1"                          # 플래그런트 1
    - "flagrant_2"                          # 플래그런트 2
    - "technical"                           # 테크니컬

  # 판정 신뢰도
  # TODO: 파울 판정 신뢰도 임계치(0.75/0.90/0.85)는 초기 설계값,
  #       오탐/미탐 분석 데이터 축적 후 캘리브레이션 필요
  confidence:
    min_for_call: 0.75                      # 판정 최소 신뢰도
    min_for_flagrant: 0.90                  # 플래그런트 최소 신뢰도
    min_for_technical: 0.85                 # 테크니컬 최소 신뢰도

# -----------------------------------------------------------------------------
# 패스 감지 (pass_event_detector.py)
# -----------------------------------------------------------------------------
pass_detection:
  criteria:
    ball_release_speed_min_ms: 2.0          # 최소 릴리스 속도 (m/s)
    min_pass_distance_m: 2.0                # 최소 패스 거리
    receiver_catch_confirmation: true       # 수신자 캐치 확인

  # 패스 유형
  types:
    - "chest_pass"                          # 체스트 패스
    - "bounce_pass"                         # 바운스 패스
    - "overhead_pass"                       # 오버헤드 패스
    - "skip_pass"                           # 스킵 패스
    - "lob_pass"                            # 로브 패스
    - "behind_back_pass"                    # 비하인드 더 백
    - "no_look_pass"                        # 노룩 패스
    - "outlet_pass"                         # 아울렛 패스
    - "entry_pass"                          # 엔트리 패스

# -----------------------------------------------------------------------------
# 점유 감지 (possession_detector.py)
# -----------------------------------------------------------------------------
possession_detection:
  # 점유 전환 조건
  transition:
    ball_control_min_frames: 5              # 공 확보 최소 프레임
    max_loose_ball_duration_sec: 3.0        # 루즈볼 최대 시간
    shot_clock_sec: 24                      # 슛클락 (초)

  # 점유 시간 분류 (stats_constants.py 기준)
  timing:
    early_clock_sec: 8                      # 빠른 공격 구간
    mid_clock_sec: 16                       # 중간 공격 구간
    fast_break_max_sec: 7.0                 # 속공 판정 기준
    early_offense_max_sec: 10.0             # 얼리 오펜스 기준

# -----------------------------------------------------------------------------
# 교체 감지 (substitution_detector.py)
# -----------------------------------------------------------------------------
substitution_detection:
  trigger:
    dead_ball_required: true                # 데드볼 시에만
    bench_area_detection: true              # 벤치 영역 감지
    player_enter_exit_tracking: true        # 선수 입퇴장 추적
    min_stay_after_sub_sec: 20.0            # 교체 후 최소 체류 시간

# -----------------------------------------------------------------------------
# 점프볼/팁오프 감지 (jumpball_detector.py)
# -----------------------------------------------------------------------------
jumpball_detection:
  trigger:
    center_circle_proximity_m: 2.0          # 센터 서클 근접 판정
    two_players_facing: true                # 2인 대면 확인
    referee_toss_detection: true            # 심판 토스 감지
    ball_upward_velocity_min_ms: 3.0        # 공 상승 속도 최소

# -----------------------------------------------------------------------------
# 타임아웃 감지 (timeout_detector.py)
# -----------------------------------------------------------------------------
timeout_detection:
  trigger:
    game_clock_stopped: true                # 경기 시계 정지 확인
    coach_signal_detection: false           # 코치 신호 감지 (미구현)
    player_inactivity_sec: 10.0             # 선수 비활동 시간 기준
    scoreboard_change_detection: true       # 전광판 변화 감지

# -----------------------------------------------------------------------------
# 쿼터/하프타임 감지 (period_detector.py)
# -----------------------------------------------------------------------------
period_detection:
  trigger:
    clock_zero_detection: true              # 경기 시계 0초 감지
    buzzer_detection: false                 # 부저 음향 감지 (미구현)
    player_court_exit_detection: true       # 선수 코트 이탈 확인
    min_break_duration_sec: 30.0            # 최소 휴식 시간 판정

# -----------------------------------------------------------------------------
# 이벤트 처리 공통 설정
# -----------------------------------------------------------------------------
common:
  # 프레임 기준 (30fps 기준)
  default_fps: 30

  # 이벤트 중복 제거
  deduplication:
    time_window_sec: 1.0                    # 동일 이벤트 중복 제거 시간 창
    spatial_threshold_m: 0.5                # 공간 중복 제거 기준

  # 이벤트 큐 설정
  queue:
    max_pending_events: 100                 # 최대 대기 이벤트 수
    processing_priority_enabled: true       # 우선순위 처리 활성화

  # 멀티카메라 이벤트 융합
  multi_camera:
    fusion_enabled: true
    temporal_alignment_ms: 50               # 시간 정렬 허용 오차
    min_agreement_ratio: 0.6                # 최소 합의 비율 (60%)
