# =============================================================================
# COURTVIEW_DESK - 통계 분석 설정 (statistics.yaml)
#
# 기본/고급 스탯 산출, Four Factors, EPV, PPP, xFG% 모델 파라미터.
#
# 학술 근거:
#   - Oliver, D. (2004). "Basketball on Paper." Potomac Books.
#     (Four Factors 개념 정립, 가중치 40/25/20/15는 분석 커뮤니티 관행)
#   - Hollinger, J. (2005). "Pro Basketball Forecast." Potomac Books.
#     (PER 수식, FT Trip Factor 0.44)
#   - Kubatko, J. et al. (2007). "A Starting Point for Analyzing
#     Basketball Statistics." J. Quantitative Analysis in Sports, 3(1).
#     (TS%, eFG%, USG% 수식 표준화)
#
# 참조 상수:
#   - shared/constants/stats_constants.py: 전 상수 (TS%, eFG%, USG%, PER)
#   - shared/constants/game_management_constants.py: 경기 시간, 쿼터
#
# 작성자: SPOIN_COURTVIEW
# 최종 수정: 2026-03-20
# 버전: 1.0.0
# =============================================================================

# -----------------------------------------------------------------------------
# 기본 스탯 카테고리 (StatCategory.BASIC)
# -----------------------------------------------------------------------------
basic_stats:
  # 박스스코어 기본 항목
  categories:
    - "points"                              # 득점 (PTS)
    - "rebounds"                            # 리바운드 (REB = OREB + DREB)
    - "assists"                             # 어시스트 (AST)
    - "steals"                              # 스틸 (STL)
    - "blocks"                              # 블록 (BLK)
    - "turnovers"                           # 턴오버 (TOV)
    - "personal_fouls"                      # 개인 파울 (PF)
    - "minutes_played"                      # 출전 시간 (MIN)
    - "field_goals_made"                    # 야투 성공 (FGM)
    - "field_goals_attempted"               # 야투 시도 (FGA)
    - "three_pointers_made"                 # 3점 성공 (3PM)
    - "three_pointers_attempted"            # 3점 시도 (3PA)
    - "free_throws_made"                    # 자유투 성공 (FTM)
    - "free_throws_attempted"               # 자유투 시도 (FTA)
    - "offensive_rebounds"                  # 공격 리바운드 (OREB)
    - "defensive_rebounds"                  # 수비 리바운드 (DREB)
    - "plus_minus"                          # +/- (경기 중 득실차)

# -----------------------------------------------------------------------------
# 슈팅 스탯 (StatCategory.SHOOTING)
# -----------------------------------------------------------------------------
shooting_stats:
  # 기본 슈팅 비율
  percentages:
    - "fg_pct"                              # FG% = FGM / FGA
    - "three_pct"                           # 3P% = 3PM / 3PA
    - "ft_pct"                              # FT% = FTM / FTA
    - "efg_pct"                             # eFG% = (FG + 0.5 × 3PM) / FGA
    - "ts_pct"                              # TS% = PTS / (2 × (FGA + 0.44 × FTA))

  # 수식 계수 (stats_constants.py에서 정의)
  formula_coefficients:
    free_throw_trip_factor: 0.44            # FTA → 점유 환산 (Hollinger)
    three_point_efg_bonus: 0.5              # 3점 eFG% 보너스

# -----------------------------------------------------------------------------
# 고급 스탯 (StatCategory.ADVANCED)
# -----------------------------------------------------------------------------
advanced_stats:
  # PER (Player Efficiency Rating)
  per:
    assist_factor: 0.6667                   # 2/3
    free_throw_factor: 0.5
    league_average: 15.0                    # PER 리그 평균 정규화 기준
    players_on_court: 5                     # 코트 위 팀원 수

  # USG% (Usage Rate)
  usg:
    formula: "100 × ((FGA + 0.44 × FTA + TOV) × (TM_MP / 5)) / (MP × (TM_FGA + 0.44 × TM_FTA + TM_TOV))"

  # Offensive/Defensive Rating
  ratings:
    possessions_formula: "FGA - OREB + TOV + 0.44 × FTA"  # 점유 수 추정식
    per_100_normalization: 100              # per-100 점유 정규화

  # Net Rating
  net_rating:
    calculation: "ORtg - DRtg"

# -----------------------------------------------------------------------------
# Dean Oliver Four Factors (StatCategory.FOUR_FACTORS)
# 참조: Oliver, D. (2004). Basketball on Paper.
# -----------------------------------------------------------------------------
four_factors:
  weights:
    efg_pct: 0.40                           # eFG% — 40% (슈팅 효율)
    tov_pct: 0.25                           # TOV% — 25% (턴오버율)
    oreb_pct: 0.20                          # OREB% — 20% (공격 리바운드율)
    ft_rate: 0.15                           # FT Rate — 15% (자유투율)

  # Four Factors 산출식
  formulas:
    efg_pct: "(FGM + 0.5 × 3PM) / FGA"
    tov_pct: "TOV / (FGA + 0.44 × FTA + TOV)"
    oreb_pct: "OREB / (OREB + OPP_DREB)"
    ft_rate: "FTA / FGA"

# -----------------------------------------------------------------------------
# 점유 분석 (StatCategory.POSSESSION)
# -----------------------------------------------------------------------------
possession_stats:
  # PPP (Points Per Possession)
  # 출처: NBA.com/stats 2023-24 리그 평균 PPP ~1.08
  # 참고: Cleaning the Glass (cleaningtheglass.com) 퍼센타일 분포 참조
  ppp:
    league_average: 1.08                    # NBA 2023-24 리그 평균 PPP
    elite_threshold: 1.20                   # 엘리트 (상위 10%)
    good_threshold: 1.10                    # 양호 (상위 25%)
    average_threshold: 1.00                 # 평균
    poor_threshold: 0.90                    # 부진 (하위 25%)
    # TODO: PPP 등급 임계치(1.20/1.10/1.00/0.90)는 NBA 기준 추정값,
    #       KBL/FIBA 리그별 실데이터 캘리브레이션 필요

  # 점유 시간 분류 (슛클락 24초 기준)
  timing:
    early_clock_sec: 8                      # 빠른 공격 (0~8초)
    mid_clock_sec: 16                       # 중간 공격 (8~16초)
    late_clock_sec: 24                      # 지연 공격 (16~24초)

  # 속공 / 얼리 오펜스
  # 참고: NBA 분류 기준 — 속공 ~7초 이내, 얼리 오펜스 ~10초 이내
  transition:
    fast_break_max_sec: 7.0
    early_offense_max_sec: 10.0
    # TODO: 속공/얼리 오펜스 시간 기준은 NBA 트래킹 데이터 관행,
    #       FIBA 24초 / NBA 24초 동일하나 리그별 페이스 차이 반영 필요

# -----------------------------------------------------------------------------
# EPV (Expected Possession Value) 모델
# -----------------------------------------------------------------------------
# 출처: Cervone, D. et al. (2016). "A Multiresolution Stochastic Process
#        Model for Predicting Basketball Possession Outcomes."
#        J. American Statistical Association, 111(514), 585-599.
#        (EPV 개념 정립, 공간 해상도 및 점유 단위 갱신 모델)
epv:
  league_average_ppp: 1.08                  # 기준값 (NBA 2023-24)
  update_frequency: "per_possession"        # 점유마다 갱신
  spatial_resolution_m: 0.5                 # 공간 해상도 (미터)
  # TODO: spatial_resolution 0.5m는 Cervone et al. 논문 기반 초기값,
  #       카메라 해상도 및 트래킹 정밀도에 따라 캘리브레이션 필요

# -----------------------------------------------------------------------------
# xFG% (Expected Field Goal %) 모델
# -----------------------------------------------------------------------------
# 출처: NBA.com/stats Shot Dashboard 2023-24 시즌 데이터
#        Goldsberry, K. (2019). "Sprawlball." Houghton Mifflin. (슛 존 분류)
xfg:
  # 수비자 거리에 따른 컨테스트 수준
  # 출처: NBA.com Closest Defender 분류 기준 (2ft/4ft/6ft → 미터 변환)
  contest_levels:
    tight_distance_m: 0.6                   # 타이트 (< 0.6m ≈ 2ft)
    moderate_distance_m: 1.2                # 보통 (0.6~1.2m ≈ 2-4ft)
    open_distance_m: 1.8                    # 오픈 (1.2~1.8m ≈ 4-6ft)
    # > 1.8m = 완전 오픈 (≈ 6ft+)

  # 슛 유형별 기대 xFG% (기준값, 컨테스트/거리 보정 전)
  # 출처: NBA.com/stats 2023-24 시즌 Shot Zone FG% 리그 평균
  baseline:
    restricted_area: 0.63                   # 제한 구역 63% (NBA 2023-24 ~63%)
    paint_non_ra: 0.40                      # 페인트존 40% (NBA ~40%)
    mid_range: 0.41                         # 미드레인지 41% (NBA ~41%)
    corner_three: 0.39                      # 코너 3점 39% (NBA ~39%)
    above_break_three: 0.36                 # 윙/탑 3점 36% (NBA ~36%)
    # TODO: xFG% baseline은 NBA 2023-24 리그 평균 기준,
    #       KBL/FIBA 리그별 슛 존 FG% 데이터 캘리브레이션 필요

# -----------------------------------------------------------------------------
# 승리 확률 (WP: Win Probability) 모델
# -----------------------------------------------------------------------------
# 출처: NBA.com 클러치 정의 (±5점, 4Q/OT 5분 이내)
#        Elo 기반 WP 모델: FiveThirtyEight (Silver, N.)
win_probability:
  # 클러치 상황 정의 (NBA 공식 정의)
  clutch:
    margin_points: 5                        # 점수차 ±5점 이내 (NBA 공식)
    time_remaining_sec: 300                 # 남은 시간 5분 이내 (4Q/OT)
    min_period: 4                           # 4쿼터 이상

  # 가비지 타임 정의
  garbage_time:
    margin_points: 25                       # 점수차 25점 이상
    min_remaining_sec: 300                  # 남은 시간 5분 이상
    # TODO: 가비지 타임 기준(25점/5분)은 분석 관행 기반 추정값,
    #       리그별 경기 페이스 차이에 따라 캘리브레이션 필요

  # WP 모델 파라미터
  # 참고: Stern, H. (1994). "A Brownian Motion Model for the Progress
  #        of Sports Scores." J. American Statistical Association, 89(427).
  model:
    home_court_advantage: 0.035             # 홈코트 이점 (~3.5%, NBA 장기 평균)
    possession_value: 0.02                  # 점유권 WP 가치 (~2%)
    certain_win_threshold: 0.995
    certain_loss_threshold: 0.005
    # TODO: home_court_advantage 3.5%는 NBA 장기 평균 기반,
    #       KBL/FIBA 리그별 홈코트 이점 데이터 캘리브레이션 필요
    # TODO: possession_value 2%는 모델 추정값, 실데이터 회귀분석 필요

# -----------------------------------------------------------------------------
# 성능 등급 (PerformanceRating)
# -----------------------------------------------------------------------------
performance_rating:
  # 백분위 등급 경계
  thresholds:
    elite: 90                               # 상위 10%
    above_average: 75                       # 상위 25%
    average_low: 25                         # 하위 25%
    below_average: 10                       # 하위 10%
    # poor: < 10

# -----------------------------------------------------------------------------
# 최소 표본 크기 (통계적 유의성)
# -----------------------------------------------------------------------------
# TODO: 최소 표본 크기는 통계적 관행 기반 추정값,
#       실제 데이터 축적 후 통계적 검정력 분석으로 캘리브레이션 필요
minimum_samples:
  season_stats_games: 10                    # 시즌 통계 최소 경기 수
  shooting_stats_fga: 50                    # 슈팅 통계 최소 FGA
  free_throw_stats_fta: 25                  # 자유투 통계 최소 FTA
  advanced_stats_minutes: 200               # 고급 스탯 최소 출전 시간 (분)
  ppp_possessions: 25                       # PPP 최소 점유 수
  lineup_stats_minutes: 20                  # 라인업 분석 최소 출전 시간 (분)
  per_zone_fga: 10                          # 존별 분석 최소 FGA
  trend_games: 3                            # 추세 분석 최소 경기 수

# -----------------------------------------------------------------------------
# 추세 분석 (이동평균)
# -----------------------------------------------------------------------------
trend_analysis:
  windows:
    short: 3                                # 최근 3경기
    medium: 5                               # 최근 5경기
    long: 10                                # 최근 10경기

  outlier_detection:
    sigma: 2.0                              # 이상치 기준 (표준편차 배수, 통계학 관행 2σ)

  direction:
    rising_slope_min: 0.01                  # 상승 추세 최소 기울기
    declining_slope_max: -0.01              # 하락 추세 최대 기울기
    # TODO: 추세 기울기 임계치(±0.01)는 초기 설계값,
    #       실제 경기 데이터 축적 후 캘리브레이션 필요

# -----------------------------------------------------------------------------
# 경기 시간 정규화
# -----------------------------------------------------------------------------
normalization:
  minutes:
    nba: 48
    fiba: 40
    per_36: 36                              # per-36 min 표준화

  # 정규화 방식
  methods:
    - "per_game"                            # 경기당
    - "per_36"                              # 36분 기준
    - "per_100_possessions"                 # 100 점유 기준
