# =============================================================================
# COURTVIEW_DESK - 골대(림) 감지 설정 (hoop_detection.yaml)
#
# 림/백보드/네트 감지 + 네트 움직임 분석 + 득점 판정.
#
# 작성자: SPOIN_COURTVIEW
# 최종 수정: 2026-03-20
# 버전: 1.0.0
# =============================================================================

# -----------------------------------------------------------------------------
# 감지 모델
# -----------------------------------------------------------------------------
model:
  input_size: 640
  confidence_threshold: 0.6
  nms_iou_threshold: 0.5
  max_detections: 4                    # 양쪽 골대 (림 2 + 백보드 2)

# -----------------------------------------------------------------------------
# 클래스 분류
# -----------------------------------------------------------------------------
classes:
  rim: 0
  backboard: 1
  net: 2

# -----------------------------------------------------------------------------
# 색상 필터 (HSV)
# -----------------------------------------------------------------------------
color_filter:
  # 림 (오렌지)
  rim_lower: [5, 100, 100]
  rim_upper: [25, 255, 255]
  # 백보드 (흰색)
  backboard_lower: [0, 0, 180]
  backboard_upper: [180, 30, 255]
  # 네트 (흰색)
  net_lower: [0, 0, 160]
  net_upper: [180, 40, 255]

# -----------------------------------------------------------------------------
# 림 물리 규격
# -----------------------------------------------------------------------------
# 출처: FIBA Official Basketball Rules 2024, Annex B (FIBA 최소 450mm)
#        NBA Rule Book 2024-25, Rule 1-II (18 inch = 457.2mm 표준)
# SSOT: utils/basketball_geometry.py (Phase 4 하이브리드 통일, 2026-04-20)
#       HOOP_DIAMETER_M=0.4572, HOOP_RADIUS_M=0.2286
rim_spec:
  height_m: 3.05                       # 10 ft (FIBA/NBA 공식 규격)
  diameter_m: 0.4572                   # 18 inch (FIBA 최소 450mm 이상, NBA 표준)
  radius_m: 0.2286                     # 9 inch — utils와 SSOT 일치
  offset_from_backboard_m: 0.375       # 37.5 cm
  # 유소년 규격
  youth_height_m: 2.6                  # 8.5 ft (유소년 권장)

# -----------------------------------------------------------------------------
# 득점 판정
# -----------------------------------------------------------------------------
# TODO: 득점 판정 파라미터(신뢰도 0.85, 입사각 30-80°)는 초기 설계값,
#       실제 득점 판정 정확도 데이터로 캘리브레이션 필요
scoring:
  confidence_threshold: 0.85
  height_tolerance_m: 0.3              # 림 높이 ±30cm 내 공 위치
  entry_angle_min_deg: 30.0
  entry_angle_max_deg: 80.0
  # 판정 윈도우
  pre_score_frames: 15                 # 득점 전 분석 프레임
  post_score_frames: 10                # 득점 후 확인 프레임

# -----------------------------------------------------------------------------
# 네트 움직임 분석
# -----------------------------------------------------------------------------
net_analysis:
  enabled: true
  # 득점 유형 분류
  # TODO: 네트 움직임 임계치(스위시/림인/림아웃)는 초기 설계값,
  #       실제 네트 광학 흐름 데이터로 캘리브레이션 필요
  swish_vertical_ratio: 0.8            # 스위시: 수직 움직임 80%+
  rim_in_oscillation_threshold: 3.0    # 림인: 진동 횟수
  rim_out_oscillation_threshold: 1.5   # 림아웃: 약한 진동
  # 광학 흐름 (Lucas-Kanade)
  optical_flow_win_size: [21, 21]
  optical_flow_max_level: 3
  optical_flow_min_features: 10
  # 움직임 임계값
  motion_min_magnitude: 2.0            # 픽셀 단위 최소 움직임
  motion_settling_frames: 30           # 네트 정지까지 프레임

# -----------------------------------------------------------------------------
# 멀티뷰 융합
# -----------------------------------------------------------------------------
multi_view:
  min_views: 2
  position_consensus_threshold_m: 0.2
  scoring_consensus_required: true     # 2+ 뷰 합의 필요
