# =============================================================================
# COURTVIEW_DESK - 로컬 환경 설정 (local.yaml)
#
# 개발/디버깅용 로컬 환경 오버라이드.
# base_config.yaml 위에 병합 적용.
#
# 참조:
#   - configs/base/base_config.yaml: 기본 설정 (base)
#   - configs/desktop/performance.yaml: 성능 설정
#
# 작성자: SPOIN_COURTVIEW
# 최종 수정: 2026-03-20
# 버전: 1.0.0
# =============================================================================

# 환경 메타데이터
environment:
  name: "local"
  description: "로컬 개발/디버깅 환경"
  base_config: "base_config.yaml"          # 기본 설정 파일 (병합 대상)

# -----------------------------------------------------------------------------
# 시스템 오버라이드
# -----------------------------------------------------------------------------
system:
  log_level: "DEBUG"                       # 디버그 로그 활성화
  log_format: "text"                       # 텍스트 포맷 (가독성 우선)
  max_workers: 2                           # 개발 시 워커 수 축소

# -----------------------------------------------------------------------------
# 비디오 오버라이드
# -----------------------------------------------------------------------------
video:
  file:
    max_size_bytes: 524288000              # 500MB (개발용 축소)

# -----------------------------------------------------------------------------
# 파이프라인 오버라이드
# -----------------------------------------------------------------------------
pipeline:
  batch_size: 4                            # 작은 배치
  prefetch_frames: 8                       # 프리페치 축소
  max_concurrent_analyses: 1               # 단일 분석만
  enable_profiling: true                   # 프로파일링 활성화

# -----------------------------------------------------------------------------
# 스토리지 오버라이드
# -----------------------------------------------------------------------------
storage:
  root_dir: "courtview_data_dev"           # 개발용 디렉토리 분리
  max_disk_usage_percent: 50               # 디스크 사용 제한

# -----------------------------------------------------------------------------
# API 서버 오버라이드
# -----------------------------------------------------------------------------
api_server:
  host: "127.0.0.1"                        # 로컬만
  port: 8000
  reload: true                             # 코드 변경 시 자동 재시작
  debug: true                              # 디버그 모드
  cors_origins:
    - "http://localhost:3000"              # 프론트엔드 개발 서버
    - "http://127.0.0.1:3000"

# -----------------------------------------------------------------------------
# GPU 오버라이드
# -----------------------------------------------------------------------------
gpu:
  tensorrt:
    optimization_level: 3                  # 빌드 시간 단축 (3/5)
  inference:
    warmup_iterations: 1                   # 워밍업 축소
